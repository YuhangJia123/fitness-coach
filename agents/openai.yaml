interface:
  display_name: "Fitness Coach"
  short_description: "建立和修正个人训练计划"
  default_prompt: "使用 fitness-coach，先识别当前是本地环境还是手机/普通聊天框，再让我选择建立计划或修正计划；用选择题确认视频资源、目标/变化、文字/照片/截图/CSV/App 导入或 AI 问询，随后确认训练条件、重点部位和反馈。搜索前先检查依赖，缺少时让我选择官方搜索页、用户目录安装或临时环境。总体计划完成后，再询问是否生成本周一页 PDF；聊天框输出可复制的档案快照和计划，未来也能从 Markdown 或快照截取指定周次。"
